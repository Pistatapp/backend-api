; PiStat GPS side-effects consumer — production path for api.pistatapp.ir

[program:gps-side-effects-consumer]
process_name=%(program_name)s_%(process_num)02d
command=php /home/api/domains/api.pistatapp.ir/public_html/artisan gps:consume-side-effects --timeout=5
directory=/home/api/domains/api.pistatapp.ir/public_html
autostart=true
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
user=api
numprocs=1
redirect_stderr=true
stdout_logfile=/home/api/domains/api.pistatapp.ir/public_html/storage/logs/gps-side-effects-consumer.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=30
