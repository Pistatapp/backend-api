; PiStat GPS side-effects queue workers — production path for api.pistatapp.ir
; Keep numprocs low on eco1-small (was 8 + 32 processing → STARTING/EXITED).

[program:gps-side-effects]
process_name=%(program_name)s_%(process_num)02d
command=php /home/api/domains/api.pistatapp.ir/public_html/artisan queue:work redis --queue=gps-side-effects --sleep=1 --tries=3 --timeout=90 --max-jobs=1000 --max-time=3600
directory=/home/api/domains/api.pistatapp.ir/public_html
autostart=true
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
user=api
numprocs=2
redirect_stderr=true
stdout_logfile=/home/api/domains/api.pistatapp.ir/public_html/storage/logs/gps-side-effects.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=90
