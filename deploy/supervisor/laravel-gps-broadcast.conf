; PiStat GPS broadcast workers — production path for api.pistatapp.ir
; Must run alongside gps-processing or map markers never update from new ingests.

[program:gps-broadcast]
process_name=%(program_name)s_%(process_num)02d
command=php /home/api/domains/api.pistatapp.ir/public_html/artisan queue:work redis --queue=gps-broadcast --sleep=1 --tries=3 --timeout=60 --max-jobs=500 --max-time=3600
directory=/home/api/domains/api.pistatapp.ir/public_html
autostart=true
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
user=api
numprocs=2
redirect_stderr=true
stdout_logfile=/home/api/domains/api.pistatapp.ir/public_html/storage/logs/gps-broadcast.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=90
