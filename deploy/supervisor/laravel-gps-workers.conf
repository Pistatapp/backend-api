; PiStat GPS ingest workers — production path for api.pistatapp.ir
; Install:
;   sudo cp deploy/supervisor/laravel-gps-workers.conf /etc/supervisor/conf.d/
;   sudo cp deploy/supervisor/laravel-gps-broadcast.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl start gps-processing:* gps-broadcast:*
;
; On a small VPS keep numprocs modest (4/2). Raise only if CPU/RAM allow.

[program:gps-processing]
process_name=%(program_name)s_%(process_num)02d
command=php /home/api/domains/api.pistatapp.ir/public_html/artisan queue:work redis --queue=gps-processing --sleep=1 --tries=3 --timeout=90 --max-jobs=500 --max-time=3600
directory=/home/api/domains/api.pistatapp.ir/public_html
autostart=true
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
user=api
numprocs=4
redirect_stderr=true
stdout_logfile=/home/api/domains/api.pistatapp.ir/public_html/storage/logs/gps-processing.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=90
